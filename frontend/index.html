<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataBridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white;
    }
    .card {
      text-align: center;
      background: rgba(255,255,255,0.07);
      padding: 50px 60px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 2.8em; font-weight: 700; margin-bottom: 10px; color: #e94560; }
    .subtitle { font-size: 1.1em; color: #a8b2d8; margin-bottom: 30px; }
    .badge {
      display: inline-block;
      background: #e94560;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      margin-bottom: 20px;
    }
    .services {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .service {
      background: rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85em;
      color: #ccd6f6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>DataBridge</h1>
    <p class="subtitle">Centralisez vos fichiers Excel & CSV en base de données</p>
    <span class="badge">Interface Vue.js — Etape 6</span>
    <div class="services">
      <span class="service">PostgreSQL</span>
      <span class="service">MinIO</span>
      <span class="service">Node.js API</span>
      <span class="service">Vue.js</span>
    </div>
  </div>
</body>
</html>
