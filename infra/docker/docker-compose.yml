# =============================================================
# DataBridge — Docker Compose
# Segmentation réseau : 4 réseaux isolés (principe du moindre privilège)
#
#  net_db      (interne) : postgres  ↔ backend uniquement
#  net_storage (interne) : minio     ↔ backend uniquement
#  net_app     (bridge)  : backend   ↔ nginx
#  net_admin   (bridge)  : minio console accessible admin
# =============================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────
  # Accessible UNIQUEMENT par le backend via net_db
  # Port 5432 lié à 127.0.0.1 : accessible seulement depuis la VM (SSH tunnel)
  postgres:
    image: postgres:16-alpine
    container_name: databridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - net_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ─────────────────────────────────────────────────
  # API (9000) accessible UNIQUEMENT par le backend via net_storage
  # Console (9001) accessible depuis le LAN via net_admin
  minio:
    image: minio/minio:latest
    container_name: databridge_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    networks:
      - net_storage
      - net_admin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Init ────────────────────────────────────────────
  # Crée le bucket au premier démarrage puis s'arrête
  # Accès à MinIO via net_storage uniquement
  minio-init:
    image: minio/mc:latest
    container_name: databridge_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb local/${MINIO_BUCKET} --ignore-existing &&
      echo 'Bucket ${MINIO_BUCKET} pret.'
      "
    networks:
      - net_storage

  # ── Backend Node.js ───────────────────────────────────────
  # Connecté aux 3 réseaux internes : db, storage, app
  # Aucun port exposé vers l'extérieur — nginx gère le trafic entrant
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    container_name: databridge_backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio
    networks:
      - net_db
      - net_storage
      - net_app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Nginx + Frontend Vue.js ───────────────────────────────
  # Build multi-stage : Vue.js compilé puis servi par nginx
  # Seul point d'entrée public (port 80)
  nginx:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: databridge_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - net_app

# ── Volumes persistants ────────────────────────────────────
volumes:
  postgres_data:
    name: databridge_postgres_data
  minio_data:
    name: databridge_minio_data

# ── Réseaux isolés ─────────────────────────────────────────
networks:

  # BDD isolée : seulement postgres ↔ backend
  net_db:
    name: databridge_net_db
    driver: bridge
    internal: true

  # Stockage isolé : seulement minio ↔ backend
  net_storage:
    name: databridge_net_storage
    driver: bridge
    internal: true

  # Applicatif : nginx ↔ backend
  net_app:
    name: databridge_net_app
    driver: bridge

  # Admin : accès console MinIO depuis le LAN
  net_admin:
    name: databridge_net_admin
    driver: bridge
