services:

  # --- Base de données PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: databridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - databridge_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Stockage fichiers MinIO ---
  minio:
    image: minio/minio:latest
    container_name: databridge_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - databridge_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API Backend Node.js ---
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    container_name: databridge_backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - databridge_net

  # --- Reverse proxy Nginx + Frontend ---
  nginx:
    image: nginx:alpine
    container_name: databridge_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - databridge_net

volumes:
  postgres_data:
    name: databridge_postgres_data
  minio_data:
    name: databridge_minio_data

networks:
  databridge_net:
    name: databridge_network
    driver: bridge
